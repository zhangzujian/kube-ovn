suite: CNI daemon security mode (v2)
templates:
  - agent/agent-daemonset.yaml
tests:
  - it: runs the new CNI execution mode without legacy-only privileges
    template: agent/agent-daemonset.yaml
    set:
      masterNodes:
        - "10.0.0.1"
      cni.disableLegacyCNIExecution: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --disable-legacy-cni-execution=true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 65534
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 65534
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: NET_ADMIN
      - notContains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: SYS_ADMIN
      - notContains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: SYS_PTRACE

  - it: restores legacy daemon privileges when compatibility mode is requested
    template: agent/agent-daemonset.yaml
    set:
      masterNodes:
        - "10.0.0.1"
      cni.disableLegacyCNIExecution: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --disable-legacy-cni-execution=true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 0
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: SYS_ADMIN
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.add
          content: SYS_PTRACE
