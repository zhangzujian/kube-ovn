name: kubectl-ko

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  json-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
          - runner: ubuntu-24.04
            arch: amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          architecture: ${{ matrix.arch == 'amd64' && 'x64' || matrix.arch }}
      - name: Toolchain and image
        run: |
          go version
          go env GOOS GOARCH GOAMD64 GOEXPERIMENT GOFLAGS CGO_ENABLED
      - name: Compile diagnostic test binary
        run: go test -c -o ko.test.exe ./pkg/ko
      - name: Direct serialization and concurrent serialization
        run: ./ko.test.exe -test.run '^TestJSONDiagnosticSerialization$' -test.v -test.count=1 -test.timeout=2m
      - name: Original complete package repeated
        if: ${{ !cancelled() }}
        run: ./ko.test.exe -test.skip '^TestJSONDiagnosticSerialization$' -test.count=20 -test.timeout=3m
      - name: Fresh-process original failures repeated
        if: ${{ !cancelled() }}
        run: |
          $failed = 0
          for ($i = 1; $i -le 100; $i++) {
            $lines = & ./ko.test.exe -test.run '^(TestWebSocketBinaryStreamsAndExitStatus|TestWebSocketRejectionFallsBackToSPDY|TestDaemonSetFailureReportsOwnedPodLogsAndPreservesError)$' -test.count=1 -test.timeout=20s 2>&1
            if ($LASTEXITCODE -ne 0) {
              $lines | Write-Output
              Write-Output "[DEBUG-json-127182547277] process=$i failed"
              $failed++
            }
          }
          Write-Output "[DEBUG-json-127182547277] fresh processes failed=$failed total=100"
          if ($failed -ne 0) { exit 1 }
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --help
      - name: Repository lint and generated-file gate
        run: make lint
        env:
          CI: true
