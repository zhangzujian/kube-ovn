name: Historical ANP and BANP Diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/anp-diagnostics.yaml'
      - 'hack/anp-diagnostics-*'
      - 'hack/anp_diagnostics.py'
      - 'hack/test_anp_diagnostics.py'
      - 'test/anp/**'
      - 'docs/anp-diagnostics.md'
  workflow_dispatch:
    inputs:
      rounds:
        description: Full suite rounds per historical cluster (1-3)
        default: '1'
        required: true
      snapshot_interval:
        description: Seconds between completed rolling snapshots (1-30)
        default: '2'
        required: true
      max_incidents:
        description: Maximum detailed failure captures per round (1-30)
        default: '12'
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate the diagnostic harness
        run: |
          python -m unittest discover -s hack -p test_anp_diagnostics.py -v
          bash -n hack/anp-diagnostics-install.sh hack/anp-diagnostics-run.sh
          shellcheck hack/anp-diagnostics-install.sh hack/anp-diagnostics-run.sh
          cd test/anp
          go test -count=1 -run '^TestConformanceManifestsURL$' .
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh -o /tmp/install-golangci-lint.sh
          bash /tmp/install-golangci-lint.sh -b "$RUNNER_TEMP/bin" v2.14.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Full repository lint
        run: make lint

  diagnostics:
    runs-on: ubuntu-26.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        source: ['v1.15.28', 'v1.16.10']
        family: ['ipv4', 'ipv6', 'dual']
    env:
      SOURCE_VERSION: ${{ matrix.source }}
      IP_FAMILY: ${{ matrix.family }}
      ROUNDS: ${{ inputs.rounds || '1' }}
      SNAPSHOT_INTERVAL: ${{ inputs.snapshot_interval || '2' }}
      MAX_INCIDENTS: ${{ inputs.max_incidents || '12' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          install_only: true
      - name: Install pinned historical components
        run: bash hack/anp-diagnostics-install.sh
      - name: Run the original suite with diagnostics
        run: bash hack/anp-diagnostics-run.sh
      - name: Collect component and restarted container logs
        if: always()
        run: python hack/anp_diagnostics.py --output anp-diagnostics/final-logs --final-logs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: anp-diagnostics-${{ matrix.source }}-${{ matrix.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            anp-diagnostics
            !anp-diagnostics/anp.test
          retention-days: 14
          if-no-files-found: error
