name: Network Policy Performance Evidence

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  KIND_VERSION: v0.33.0

jobs:
  controlled-runtime:
    name: Controlled NetworkPolicy runtime comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          docker-images: false
          large-packages: false
          tool-cache: false

      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Install kind
        uses: helm/kind-action@v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          install_only: true

      - name: Install jinjanator
        run: pipx install jinjanator

      - name: Build fixed-source Kube-OVN image
        run: make image-kube-ovn

      - name: Create Kind cluster
        run: make kind-init-ipv4

      - name: Install Kube-OVN with ANP, BANP and CNP enabled
        run: make kind-install-anp

      - name: Run controlled event storm and collect evidence
        run: python3 hack/network_policy_performance_e2e.py --output network-policy-performance

      - name: Upload controlled runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-policy-performance-${{ github.sha }}
          path: network-policy-performance/
          retention-days: 14
          if-no-files-found: warn
