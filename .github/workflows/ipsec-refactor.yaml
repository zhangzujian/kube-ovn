name: IPsec Refactor Validation

on:
  push:
    branches:
      - codex/ipsec-container
  workflow_dispatch:
    inputs:
      api_only:
        description: Run only the disposable API Server signing contract
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ipsec-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.api_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install manifest parser
        run: python3 -m pip install PyYAML
      - name: Check installation contracts
        run: |
          python3 hack/test-ipsec-container.py
          python3 hack/test-tproxy-container.py
          bash -n dist/images/install.sh
          git diff --check
      - name: Test node module and signing profile
        run: |
          go test -race ./pkg/ipsec
          go test ./pkg/controller -run TestIPsec -count=1
          go test ./pkg/ovs -run TestIPsecConfiguration -count=1
      - name: Compile candidate binaries and IPsec E2E
        run: |
          make build-go
          go test -c -o /tmp/ipsec-e2e ./test/e2e/ipsec
          git diff --exit-code
      - name: Build candidate image and validate minimal runtime privileges
        run: |
          docker build --build-arg BASE_TAG=v1.17.0@sha256:300011722d58c4c822279b034476d124f6f52d5ba607ddc68939fea1364746c1 --label org.opencontainers.image.revision="$GITHUB_SHA" -t ipsec-candidate:"$GITHUB_SHA" -f dist/images/Dockerfile dist/images
          CGO_ENABLED=0 go test -c -o /tmp/ipsec-runtime-tests ./pkg/ipsec
          bash hack/test-ipsec-runtime.sh ipsec-candidate:"$GITHUB_SHA" /tmp/ipsec-runtime-tests
          bash hack/test-ipsec-traffic.sh ipsec-candidate:"$GITHUB_SHA" /tmp/ipsec-runtime-tests
      - name: Install Kind for actual OVN overlay validation
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Validate actual cross-node OVN pod encryption
        run: bash hack/test-ipsec-overlay.sh ipsec-candidate:"$GITHUB_SHA"

  lint:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.api_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Full repository lint
        env:
          CI: 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          make lint

  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v5
      - name: Install Kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Validate real bound identities and issuer admission
        run: bash hack/test-ipsec-api.sh
