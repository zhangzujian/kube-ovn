name: CNP Upgrade Validation

on:
  pull_request:
    paths:
      - 'pkg/cnp/**'
      - 'pkg/controller/cluster_network_policy*'
      - 'pkg/controller/controller.go'
      - 'pkg/ovs/ovn-nb-cnp*'
      - 'pkg/ovs/ovn-nb-acl*'
      - 'cmd/cnp-upgrade/**'
      - 'test/e2e/cnp-upgrade/**'
      - 'test/e2e/cnp-domain/**'
      - 'test/cnp/**'
      - 'hack/cnp-upgrade-e2e.sh'
      - 'yamls/cnp/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cnp-upgrade.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install repository lint tool
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Run full repository lint
        run: make lint

  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Install API-server test tools
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@release-0.25
      - name: Validate modules and generated CNP artifacts
        run: |
          go mod tidy
          go run ./cmd/cnp-upgrade crd
          git diff --exit-code -- go.mod go.sum yamls/cnp
          (cd test/cnp && go mod tidy && go test -run '^$' ./...)
          git diff --exit-code -- test/cnp/go.mod test/cnp/go.sum
      - name: Run isolated API-server and compatibility tests
        run: |
          export KUBEBUILDER_ASSETS="$(setup-envtest use 1.35.x -p path)"
          go test -race -count=1 ./pkg/cnp
          go test -count=1 ./pkg/controller ./pkg/ovs -run 'Test.*Cnp|TestCnpProtocolMatch'
      - name: Compile controller, migration tool, and CNP domain E2E
        run: |
          go build ./cmd/controller ./cmd/cnp-upgrade
          go test -run '^$' ./test/e2e/cnp-domain
          go test -run '^$' ./test/e2e/cnp-upgrade

  build-upgrade-image:
    needs: [validate, lint]
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build candidate and upgrade suite
        run: |
          make build-go
          docker build --build-arg VERSION="$(cat VERSION)" -t cnp-upgrade:candidate -f dist/images/Dockerfile dist/images
          docker save cnp-upgrade:candidate -o cnp-upgrade.tar
          go test -c -o cnp-upgrade.test ./test/e2e/cnp-upgrade
      - uses: actions/upload-artifact@v7
        with:
          name: cnp-upgrade-candidate
          path: |
            cnp-upgrade.tar
            cnp-upgrade.test
          retention-days: 7

  version-upgrade:
    needs: build-upgrade-image
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source: ['v1.15.28', 'v1.16.10']
        family: ['ipv4', 'ipv6', 'dual']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          install_only: true
      - uses: actions/download-artifact@v8
        with:
          name: cnp-upgrade-candidate
      - name: Install the legacy release in an isolated kind cluster
        env:
          SOURCE_VERSION: ${{ matrix.source }}
          IP_FAMILY: ${{ matrix.family }}
        run: bash hack/cnp-upgrade-e2e.sh
      - name: Upgrade, verify traffic, migrate, finalize and roll back
        env:
          CNP_UPGRADE_SOURCE_IMAGE: docker.io/kubeovn/kube-ovn:${{ matrix.source }}
          E2E_BRANCH: master
          E2E_IP_FAMILY: ${{ matrix.family }}
          E2E_NETWORK_MODE: overlay
        run: |
          chmod +x cnp-upgrade.test
          ./cnp-upgrade.test -ginkgo.v -ginkgo.focus='\[group:cnp-upgrade\]' -ginkgo.timeout=35m -kubeconfig "$HOME/.kube/config"
      - name: Run v0.2.0 CNP conformance on the compatible controller
        run: |
          kubectl get cnp -o json | jq -e '.items | length == 0'
          kubectl apply -f yamls/cnp/native.yaml
          KUBECONFIG="$HOME/.kube/config" make kube-ovn-cnp-e2e
      - name: Verify retained v1alpha1 ANP and BANP conformance
        run: KUBECONFIG="$HOME/.kube/config" make kube-ovn-anp-e2e
      - name: Collect upgrade evidence
        if: always()
        run: |
          mkdir -p cnp-evidence
          kubectl get pods,deployments,replicasets,leases -n kube-system -o yaml > cnp-evidence/control-plane.yaml
          kubectl get pods -n kube-system -l app=kube-ovn-controller -o json | jq '[.items[] | {name:.metadata.name,uid:.metadata.uid,capability:.metadata.annotations["kube-ovn.io/cnp-capability"],receipt:.metadata.annotations["kube-ovn.io/cnp-verification-receipt"]}]' > cnp-evidence/application-receipts.json
          kubectl get cnp,crd -o yaml > cnp-evidence/policy-schema.yaml
          kubectl get events -A -o yaml > cnp-evidence/events.yaml
          kubectl logs -n kube-system -l app=kube-ovn-controller --all-containers=true --tail=5000 > cnp-evidence/controller.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cnp-upgrade-${{ matrix.source }}-${{ matrix.family }}
          path: |
            cnp-evidence
            cnp-test-report.yaml
          retention-days: 7
